<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TravelBloom</title>
    <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <img src="images/travel_logo.jpeg" alt="TravelBloom Logo">
            <span>TravelBloom</span>
        </div>

        <!-- nav links -->
        <div class="navbar-links">
            <a href="#">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>

        <!-- search bar -->
        <div class="navbar-search">
            <input
                    type="text"
                    id="searchInput"
                    placeholder="Enter a destination or keyword"
            >
            <span class="search-icon">🔍</span>
            <button id="searchBtn">Search</button>
            <button id="clearBtn">Clear</button>
        </div>
    </nav>
    <!-- Hero section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Explore Dream Destination</h1>
            <p>
                The Travel Recommendation App helps users explore popular travel destinations through an interactive and user-friendly interface.
            </p>
            <button>Book Now</button>
        </div>
        <div class="hero-social">
            <ul>
                <li><a href="https://www.facebook.com"><img src="images/facebook.svg" alt="Facebook"></a></li>
                <li><a href="https://www.twitter.com"><img src="images/twitter.svg" alt="Twitter"></a></li>
                <li><a href="https://www.instagram.com"><img src="images/instagram.svg" alt="Instagram"></a></li>
                <li><a href="https://www.youtube.com"><img src="images/youtube.svg" alt="YouTube"></a></li>
            </ul>
        </div>
    </section>
    <script src="travel_recommendation.js"></script>
</body>
</html>
